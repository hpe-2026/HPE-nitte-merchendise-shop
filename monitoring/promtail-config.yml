server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - nitte-node-backend
              - nitte-python-service
              - nitte-frontend
              - nitte-admin-dashboard
              - nitte-mongodb
              - nitte-keycloak
              - nitte-unleash
              - nitte-flagsmith
              - nitte-jaeger
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'  
        target_label: service
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - source_labels: [__meta_docker_container_image_name]
        target_label: image
      - source_labels: [service]
        regex: 'nitte-.*'
        action: keep
    pipeline_stages:
      - json:
          expressions:
            level:   level
            message: message
            service: service
      - labels:
          level:
          service:
      - drop:
          expression: '.*(GET /api/health|GET /ping).*'