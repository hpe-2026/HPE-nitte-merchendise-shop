services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: nitte-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - nitte-network
    depends_on:
      - node-backend
      - python-service

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nitte-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - nitte-network
    depends_on:
      - prometheus

  # Jaeger - Distributed Tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    container_name: nitte-jaeger
    ports:
      # OTLP receivers (OpenTelemetry Protocol)
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      # Legacy Jaeger protocol (v1 compatibility)
      - "6831:6831/udp"   # Jaeger agent (Thrift compact)
      - "6832:6832/udp"   # Jaeger agent (Thrift binary)
      - "5778:5778"       # Jaeger agent (HTTP)
      # Jaeger collector
      - "14268:14268"  # Jaeger collector (HTTP)
      - "14250:14250"  # Jaeger collector (gRPC)
      # UI and Metrics
      - "16686:16686"  # Jaeger UI
      - "14269:14269"  # Prometheus metrics
      - "9411:9411"    # Zipkin compatible endpoint
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    networks:
      - nitte-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14269/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Alert Manager for alert handling
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nitte-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager-config.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - nitte-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nitte-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - nitte-network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  jaeger_data:
    driver: local

networks:
  nitte-network:
    external: true
    name: docker_nitte-network
