apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nitte-merch-ingress
  namespace: nitte-merch
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.nitte-merch-shop.com
      secretName: nitte-merch-tls
  rules:
    - host: api.nitte-merch-shop.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-backend
                port:
                  number: 3000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: node-backend
                port:
                  number: 3000

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: nitte-merch
type: Opaque
stringData:
  secret: your-super-secret-jwt-key-change-in-production-very-long-string-for-security

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-service-pdb
  namespace: nitte-merch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: python-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: node-backend-pdb
  namespace: nitte-merch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: node-backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-service-hpa
  namespace: nitte-merch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-backend-hpa
  namespace: nitte-merch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nitte-merch-sa
  namespace: nitte-merch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nitte-merch-role
  namespace: nitte-merch
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nitte-merch-rolebinding
  namespace: nitte-merch
subjects:
  - kind: ServiceAccount
    name: nitte-merch-sa
    namespace: nitte-merch
roleRef:
  kind: Role
  name: nitte-merch-role
  apiGroup: rbac.authorization.k8s.io
