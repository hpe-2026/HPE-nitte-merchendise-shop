services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nitte-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: |
        -Djenkins.install.runSetupWizard=false
        -Djenkins.security.apiToken.creationOfLegacyTokenEnabled=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc_configs:/var/jenkins_home/casc_configs
      - ./scripts:/var/jenkins_home/scripts
    networks:
      - nitte-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  jenkins_home:
    driver: local

networks:
  nitte-network:
    external: true
    name: docker_nitte-network
