version: '3.9'

services:
  # Jaeger - Distributed Tracing (v2.16.0 - latest based on OpenTelemetry Collector)
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    container_name: nitte-jaeger
    environment:
      SPAN_STORAGE_TYPE: memory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
      - "14269:14269"
      - "9411:9411"
    networks:
      - nitte-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/api/services"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nitte-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: nitte_merch_shop
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ../database/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - nitte-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python FastAPI Service
  python-service:
    build:
      context: ../python-service
      dockerfile: Dockerfile
    container_name: nitte-python-service
    environment:
      ENVIRONMENT: development
      PORT: 8000
      MONGODB_URL: mongodb://admin:password@mongodb:27017/nitte_merch_shop?authSource=admin
      DATABASE_NAME: nitte_merch_shop
      LOG_LEVEL: info
      API_GATEWAY_URL: http://node-backend:3000
      JAEGER_AGENT_HOST: nitte-jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - jaeger
    networks:
      - nitte-network
    volumes:
      - ../python-service:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Node.js API Gateway
  node-backend:
    build:
      context: ../node-backend
      dockerfile: Dockerfile
    container_name: nitte-node-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      PYTHON_SERVICE_URL: http://python-service:8000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRY: 7d
      MONGODB_URL: mongodb://admin:password@mongodb:27017/nitte_merch_shop?authSource=admin
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      REQUEST_TIMEOUT: 30000
      JAEGER_AGENT_HOST: nitte-jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "3000:3000"
    depends_on:
      - python-service
      - mongodb
      - jaeger
    networks:
      - nitte-network
    volumes:
      - ../node-backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # React Frontend - User Application
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nitte-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - node-backend
    networks:
      - nitte-network
    volumes:
      - ../frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # React Admin Dashboard
  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    container_name: nitte-admin-dashboard
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_PROMETHEUS_URL: http://localhost:9090
      VITE_JAEGER_URL: http://localhost:16686
      VITE_GRAFANA_URL: http://localhost:3001
    depends_on:
      - node-backend
    networks:
      - nitte-network
    volumes:
      - ../admin-dashboard:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: nitte-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_PORT: 8081
    command: start-dev
    ports:
      - "8081:8081"
    networks:
      - nitte-network
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Unleash DB - Feature Flag Database
  unleash-db:
    image: postgres:15
    container_name: nitte-unleash-db
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash123
      POSTGRES_DB: unleash
    networks:
      - nitte-network
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unleash - Feature Flag Service
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: nitte-unleash
    environment:
      DATABASE_URL: postgresql://unleash:unleash123@unleash-db:5432/unleash?sslmode=disable
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-frontend-api-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
    ports:
      - "4242:4242"
    depends_on:
      unleash-db:
        condition: service_healthy
    networks:
      - nitte-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4242/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  keycloak_data:
    driver: local
  unleash_db_data:
    driver: local

networks:
  nitte-network:
    driver: bridge